[project]
name = "marl"
version = "0.1.0"
description = "Multi-agent highway driving with MAPPO and WocaR-RL baselines"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "auto-lirpa",
    "gymnasium[mujoco]>=1.4.0",
    "highway-env>=1.12.1",
    "numpy>=2.4.6",
    "rich>=15.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
override-dependencies = ["torch>=2.14.1"]

[tool.uv.sources]
auto-lirpa = { git = "https://github.com/Verified-Intelligence/auto_LiRPA" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
