[project]
name = "marl"
version = "0.1.0"
description = "WocaR-RL with MARL in highway-env"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.4.0",
    "highway-env>=1.12.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marl"]

[tool.pytest.ini_options]
testpaths = ["tests"]