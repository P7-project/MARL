gym_id: highway-v0
observation:
  type: MultiAgentObservation
  observation_config:
    type: Kinematics
    vehicles_count: 5
    features: [presence, x, y, vx, vy]
    absolute: false
action:
  type: MultiAgentAction
  action_config:
    type: DiscreteMetaAction
overrides:
  lanes_count: 4
  vehicles_count: 30
  duration: 40
  initial_lane_id: null
  policy_frequency: 1
  simulation_frequency: 15
perturbation:
  features: [x, y, vx, vy]
  eps: 0.03
train:
  agents: 3
  rollout: 512
  total_steps: 200000
